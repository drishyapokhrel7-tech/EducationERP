packages:
  - "apps/*"
  - "services/*"
  - "packages/*"
# Vercel's Node.js Function packager for services/api's api/index.ts
# refuses pnpm's default symlinked node_modules layout ("The framework
# produced an invalid deployment package... files in symlinked
# directories"), specifically around the Prisma-generated client living
# in the .pnpm virtual store. Hoisted (flat, non-symlinked) node_modules
# avoids that class of problem entirely.
nodeLinker: hoisted
overrides:
  # qs is a transitive dep shared by shadcn (devDependency CLI) and the
  # real runtime chain body-parser > express > @nestjs/platform-express
  # (services/api's own direct dependency) — genuinely reachable on
  # every HTTP request (qs parses Express query strings). Pinned past
  # the array-limit-bypass and isBuffer-DoS advisories flagged by
  # `pnpm audit --prod`.
  qs: "^6.16.0"
allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  argon2: true
  electron-winstaller: false
  esbuild: true
  msgpackr-extract: true
  prisma: true
  unrs-resolver: true
